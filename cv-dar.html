<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منشئ السيرة الذاتية - دار النخبة للإستقدام</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Almarai:wght@300;400;700;800&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@200..1000&family=Tajawal:wght@300;400;500;700;800&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="cv-style.css">
</head>
<body>

  <!-- شريط أدوات التنسيق الاحترافي (Word Toolbar) -->
  <div class="word-toolbar-container">
    <div class="word-toolbar">
      <div class="toolbar-group active-target-info">
        <i class="fa-solid fa-i-cursor"></i>
        <span id="activeTargetLabel">انقر على أي نص في الكارت لتعديله وتنسيقه</span>
      </div>

      <div class="toolbar-divider"></div>

      <!-- قائمة الخطوط -->
      <div class="toolbar-group">
        <label title="نوع الخط"><i class="fa-solid fa-font"></i></label>
        <select id="toolFontFamily" class="toolbar-select">
          <option value="'Cairo', sans-serif">Cairo (افتراضي)</option>
          <option value="'Tajawal', sans-serif">Tajawal (تجوال)</option>
          <option value="'Almarai', sans-serif">Almarai (المرعي)</option>
          <option value="'Amiri', serif">Amiri (أميري - كلاسيكي)</option>
          <option value="'Aref Ruqaa', serif">Aref Ruqaa (عارف رقعة)</option>
          <option value="'Montserrat', sans-serif">Montserrat (إنجليزي/حديث)</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="'Courier New', monospace">Courier New</option>
        </select>
      </div>

      <div class="toolbar-divider"></div>

      <!-- حجم الخط -->
      <div class="toolbar-group">
        <label title="حجم الخط"><i class="fa-solid fa-text-height"></i></label>
        <button type="button" class="tool-btn" id="btnFontSizeMinus" title="تصغير الخط"><i class="fa-solid fa-minus"></i></button>
        <span id="fontSizeDisplay" class="font-size-val">15px</span>
        <button type="button" class="tool-btn" id="btnFontSizePlus" title="تكبير الخط"><i class="fa-solid fa-plus"></i></button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- الأنماط الأساسية B I U S -->
      <div class="toolbar-group">
        <button type="button" class="tool-btn" id="btnBold" title="عريض (Bold)"><i class="fa-solid fa-bold"></i></button>
        <button type="button" class="tool-btn" id="btnItalic" title="مائل (Italic)"><i class="fa-solid fa-italic"></i></button>
        <button type="button" class="tool-btn" id="btnUnderline" title="تحته خط (Underline)"><i class="fa-solid fa-underline"></i></button>
        <button type="button" class="tool-btn" id="btnStrikethrough" title="يتوسطه خط / شخطة (Strikethrough)"><i class="fa-solid fa-strikethrough"></i></button>
      </div>

     <div class="toolbar-divider"></div>

      <!-- محاذاة النص (يمين - وسط - يسار) -->
      <div class="toolbar-group">
        <button type="button" class="tool-btn" id="btnAlignRight" title="محاذاة لليمين"><i class="fa-solid fa-align-right"></i></button>
        <button type="button" class="tool-btn" id="btnAlignCenter" title="محاذاة للوسط"><i class="fa-solid fa-align-center"></i></button>
        <button type="button" class="tool-btn" id="btnAlignLeft" title="محاذاة لليسار"><i class="fa-solid fa-align-left"></i></button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- لون النص -->
      <div class="toolbar-group">
        <label title="لون النص"><i class="fa-solid fa-palette"></i></label>
        <input type="color" id="toolTextColor" class="toolbar-color-picker" value="#000000" title="اختر لون النص">
        <div class="quick-colors">
          <span class="color-dot" style="background:#000000;" data-color="#000000" title="أسود"></span>
          <span class="color-dot" style="background:#ffffff;" data-color="#ffffff" title="أبيض"></span>
          <span class="color-dot" style="background:#0C4369;" data-color="#0C4369" title="أزرق النخبة"></span>
          <span class="color-dot" style="background:#dc2626;" data-color="#dc2626" title="أحمر"></span>
          <span class="color-dot" style="background:#16a34a;" data-color="#16a34a" title="أخضر"></span>
          <span class="color-dot" style="background:#d97706;" data-color="#d97706" title="برتقالي/ذهبي"></span>
        </div>
      </div>

      <div class="toolbar-divider"></div>

      <!-- إعادة تعيين التنسيق -->
      <div class="toolbar-group">
        <button type="button" class="tool-btn btn-reset-style" id="btnResetStyle" title="إعادة التنسيق للوضع الافتراضي">
          <i class="fa-solid fa-rotate-left"></i> إعادة التنسيق
        </button>
      </div>
    </div>
  </div>

  <div class="app-container">
    
    <!-- لوحة إدخال البيانات الجانبية -->
    <aside class="editor-panel">
      <div class="panel-header">
        <h2>إدخال بيانات - دار النخبة</h2>
        <button type="button" class="btn-reset" onclick="location.reload()">
          <h2>RESET ALL ⚠️</h2>
        </button>
      </div>
      <form id="cvForm">
        
        <div class="form-group full-width">
          <label>صورة العاملة (من الجهاز):</label>
          <input type="file" id="inputPhoto" accept="image/*">
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>كود رقم:</label>
            <input type="text" id="inputCode" placeholder="مثال: L 1529">
          </div>
          <div class="form-group">
            <label>الدولة والعلم:</label>
            <select id="inputCountrySelect">
              <option value="" disabled selected>اختر الدولة</option>
              <option value="الفلبين" data-flag="src/1.png">الفلبين</option>
              <option value="اثيوبيا" data-flag="src/2.png">اثيوبيا</option>
              <option value="كينيا" data-flag="src/3.png">كينيا</option>
              <option value="سيريلانكا" data-flag="src/4.png">سيريلانكا</option>
              <option value="بنقلادش" data-flag="src/5.png">بنقلادش</option>
              <option value="الهند" data-flag="src/6.png">الهند</option>
              <option value="اوغندا" data-flag="src/7.png">اوغندا</option>
              <option value="باكستان" data-flag="src/8.png">باكستان</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label>Name (الاسم بالإنجليزية):</label>
            <input type="text" id="inputName" placeholder="الاسم الكامل">
          </div>
          <div class="form-group full-width">
            <label>فيديو تعريفي (رابط YouTube):</label>
            <input type="text" id="inputVideo" placeholder="رابط الفيديو التعريفي">
          </div>
          <div class="form-group">
            <label>الوزن:</label>
            <input type="text" id="inputWeight" placeholder="مثال: 68">
          </div>
          <div class="form-group">
            <label>الطول:</label>
            <input type="text" id="inputHeight" placeholder="مثال: 166">
          </div>
          <div class="form-group">
            <label>الديانة:</label>
               <select id="inputReligion">
              <option value="" disabled selected>إختيار</option>
              <option value="مسلمة">مسلمة</option>
              <option value="غير مسلمة">غير مسلمة</option>
              <option value="مسيحية">مسيحية</option>
          </select>
          </div>
          <div class="form-group">
            <label>تاريخ الميلاد (لحساب العمر تلقائياً):</label>
            <input type="date" id="inputBirthDate">
          </div>
          <div class="form-group">
            <label>العمر:</label>
            <input type="text" id="inputAge" placeholder="مثال: 44">
          </div>
          <div class="form-group">
            <label>رقم الجواز:</label>
            <input type="text" id="inputPassport" placeholder="رقم الجواز">
          </div>
        </div>

        <h3>العمل خارج البلاد (Worked abroad)</h3>
        <div class="form-group full-width">
          <label>حالة الخبرة (مثل: لم يسبق لها العمل):</label>
          <select id="inputExpTitle">
              <option value="" disabled selected>إختيار</option>
              <option value="سبق لها العمل">سبق لها العمل</option>
              <option value="لم يسبق لها العمل">لم يسبق لها العمل</option>
          </select>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>الوظيفة:</label>
               <select id="inputJob">
              <option value="" disabled selected>إختيار</option>
              <option value="عاملة منزلية">عاملة منزلية</option>
              <option value="سائق خاص">سائق خاص</option>
          </select>
          </div>
          <div class="form-group">
            <label>المدة:</label>
            <input type="text" id="inputDuration" placeholder="المدة">
          </div>
          <div class="form-group full-width">
            <label>البلد:</label>
            <input type="text" id="inputExpCountry" placeholder="البلد">
          </div>
        </div>

        <h3>البيانات الشخصية</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>الحالة الاجتماعية:</label>
               <select id="inputMarital">
              <option value="" disabled selected>إختيار</option>
              <option value="متزوجة - MARRIED">متزوجة - MARRIED</option>
              <option value="أعزب - SINGLE">غير متزوجة - SINGLE</option>
              <option value="ارملة - WIDOWED">ارملة - WIDOWED</option>
          </select>
          </div>
          <div class="form-group">
            <label>عدد الأطفال:</label>
            <input type="text" id="inputChildren" placeholder="عدد الأطفال">
          </div>
          <div class="form-group full-width">
            <label>مكان الميلاد:</label>
            <input type="text" id="inputBirthPlace" placeholder="مكان الميلاد">
          </div>
        </div>

        <h3>اللغة والتعليم</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>اللغة الإنجليزية:</label>
               <select id="inputEnglish">
              <option value="" disabled selected>إختيار</option>
              <option value="أساسيات - BASIC">أساسيات - BASIC</option>
              <option value="لا - NO">لا - NO</option>
              <option value="ضعيف - POOR">ضعيف - POOR</option>
              <option value="جيد - GOOD">جيد - GOOD</option>
              <option value="قليل - LITTLE">قليل - LITTLE</option>
          </select>
          </div>
          <div class="form-group">
            <label>اللغة العربية:</label>
              <select id="inputArabic">
              <option value="" disabled selected>إختيار</option>
              <option value="أساسيات - BASIC">أساسيات - BASIC</option>
              <option value="لا - NO">لا - NO</option>
              <option value="ضعيف - POOR">ضعيف - POOR</option>
              <option value="جيد - GOOD">جيد - GOOD</option>
              <option value="قليل - LITTLE">قليل - LITTLE</option>
          </select>
          </div>
          <div class="form-group full-width">
            <label>التعليم:</label>
              <select id="inputEducation">
              <option value="" disabled selected>إختيار</option>
              <option value="خريجة جامعية - COLLEGE LEVEL">خريجة جامعية - COLLEGE LEVEL</option>
              <option value="ثانوية - HIGH SCHOOL">ثانوية - HIGH SCHOOL</option>
              <option value="ابتدائية - ELEMENTARY">ابتدائية - ELEMENTARY</option>
          </select>
          </div>
        </div>

      <h3>مهارات العاملة</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>عناية الأطفال:</label>
            <select id="inputBabyCare">
              <option value="" disabled selected>إختيار</option>
              <option value="نعم">نعم</option>
              <option value="لا">لا</option>
              <option value="WILLING">WILLING</option>
            </select>
          </div>
          <div class="form-group">
            <label>التنظيف:</label>
            <select id="inputCleaning">
              <option value="" disabled selected>إختيار</option>
              <option value="نعم">نعم</option>
              <option value="لا">لا</option>
              <option value="WILLING">WILLING</option>
            </select>
          </div>
          <div class="form-group">
            <label>عناية كبار السن:</label>
            <select id="inputElderlyCare">
              <option value="" disabled selected>إختيار</option>
              <option value="نعم">نعم</option>
              <option value="لا">لا</option>
              <option value="WILLING">WILLING</option>
            </select>
          </div>
          <div class="form-group">
            <label>الغسيل:</label>
            <select id="inputWashing">
              <option value="" disabled selected>إختيار</option>
              <option value="نعم">نعم</option>
              <option value="لا">لا</option>
              <option value="WILLING">WILLING</option>
            </select>
          </div>
          <div class="form-group">
            <label>الطبخ:</label>
            <select id="inputCooking">
              <option value="" disabled selected>إختيار</option>
              <option value="نعم">نعم</option>
              <option value="لا">لا</option>
              <option value="WILLING">WILLING</option>
            </select>
          </div>
          <div class="form-group">
            <label>الكوي:</label>
            <select id="inputIroning">
              <option value="" disabled selected>إختيار</option>
              <option value="نعم">نعم</option>
              <option value="لا">لا</option>
              <option value="WILLING">WILLING</option>
            </select>
          </div>
        </div>

        <button type="button" class="btn-download" onclick="downloadCVAsJPG()">تنزيل السيرة الذاتية (JPG)</button>
          <button type="button" class="btn-print" onclick="printCV()">
            <i class="fa-solid fa-print"></i> طباعة السيرة الذاتية / حفظ PDF
          </button>
      </form>
    </aside>

    <!-- المعاينة الحية للورقة Overlaid فوق main.png -->
    <main class="preview-panel">
      <div class="cv-card" id="cvCard">
        
        <!-- المدخلات العلوية فوق الهيدر -->
        <span id="cvCode" class="overlay-val overlay-code"></span>
        <span id="cvCountryName" class="overlay-val overlay-country-name"></span>
        
        <!-- دائرة العلم فوق القالب -->
        <div id="cvFlagContainer" class="overlay-flag-circle">
          <img id="cvFlagImg" src="" alt="علم الدولة" style="display: none;">
        </div>

        <!-- الاسم -->
        <span id="cvName" class="overlay-val overlay-name"></span>
        <!-- فيديو تعريفي-->
        <span id="cvVideo" class="overlay-val overlay-video"></span>
        <!-- المربعات العلوية -->
        <span id="cvWeight" class="overlay-val overlay-weight"></span>
        <span id="cvHeight" class="overlay-val overlay-height"></span>
        <span id="cvPassport" class="overlay-val overlay-passport"></span>
        <span id="cvReligion" class="overlay-val overlay-religion"></span>
        <span id="cvAge" class="overlay-val overlay-age"></span>

        <!-- صورة العاملة (على اليسار) -->
        <div id="photoContainer" class="overlay-photo">
          <div class="photo-placeholder">صورة العاملة</div>
        </div>

        <!-- قسم العمل خارج البلاد -->
        <span id="cvExpTitle" class="overlay-val overlay-exp-title"></span>
        <span id="cvJob" class="overlay-val overlay-job"></span>
        <span id="cvDuration" class="overlay-val overlay-duration"></span>
        <span id="cvExpCountry" class="overlay-val overlay-exp-country"></span>

        <!-- قسم البيانات الشخصية -->
        <span id="cvMarital" class="overlay-val overlay-marital"></span>
        <span id="cvChildren" class="overlay-val overlay-children"></span>
        <span id="cvBirthPlace" class="overlay-val overlay-birthplace"></span>

        <!-- قسم اللغة والتعليم -->
        <span id="cvEnglish" class="overlay-val overlay-english"></span>
        <span id="cvArabic" class="overlay-val overlay-arabic"></span>
        <span id="cvEducation" class="overlay-val overlay-education"></span>

        <!-- قسم مهارات العاملة -->
        <span id="cvBabyCare" class="overlay-val overlay-babycare"></span>
        <span id="cvElderlyCare" class="overlay-val overlay-elderlycare"></span>
        <span id="cvCooking" class="overlay-val overlay-cooking"></span>
        <span id="cvCleaning" class="overlay-val overlay-cleaning"></span>
        <span id="cvWashing" class="overlay-val overlay-washing"></span>
        <span id="cvIroning" class="overlay-val overlay-ironing"></span>

      </div>
    </main>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="cv-script.js"></script>
</body>
</html>
